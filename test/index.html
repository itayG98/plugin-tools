<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Annotorious Selector Pack | Test</title>
    <style>
      html, body {
        background-color: #cfcfcf;
        margin: 0;
        padding: 0;
      }

      #content {
        background-color: #fff;
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 900px;
        min-height: 100vh;
        padding: 30px;
        position: relative;
      }

      #content img {
        max-width: 100%;
      }

      #tool-picker {
        margin-left: 8px;
        min-width: 140px;
      }
    </style>
  </head>
  <body>
    <div id="content">
      <p>
        <label for="tool-picker">Drawing tool</label>
        <select id="tool-picker"></select>
      </p>
      <img id="sample-image" src="640px-Hallstatt.jpg" />
    </div>

    <script type="module">
      import { W3CImageFormat, createImageAnnotator } from '@annotorious/annotorious';
      import { mountPlugin as mountToolsPlugin } from '../src';

      import '@annotorious/annotorious/annotorious.css';

      window.onload = function() {
        var anno = createImageAnnotator('sample-image', {
          adapter: W3CImageFormat('sample-image'),
        });

        anno.loadAnnotations('annotations.json');

        anno.on('createAnnotation', function (annotation) {
          console.log('created', annotation);
        });

        anno.on('updateAnnotation', function(annotation, previous) {
          console.log('updated', previous, 'with', annotation);
        });

        anno.on('deleteAnnotation', function(annotation) {
          console.log('deleted', annotation);
        });

        // Mount selector pack extension
        mountToolsPlugin(anno);

        var tools = anno.listDrawingTools();
        console.log(tools);

        var toolToggle = document.getElementById('tool-picker');

        tools.forEach(function(tool) {
          var option = document.createElement('option');
          option.value = tool;
          option.textContent = tool.toUpperCase();
          toolToggle.appendChild(option);
        });

        anno.setDrawingTool('circle');
        toolToggle.value = 'circle';

        toolToggle.addEventListener('change', function() {
          var tool = toolToggle.value;
          anno.setDrawingTool(tool);
        });
      }
    </script>
  </body>
</html>
